<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Efaz M. Afnan Feroz — Aspiring VLSI &amp; IC Design Engineer</title>
    <script>
        (function () {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --bg: #F3F9F5;
            --surface: #FFFFFF;
            --surface-2: #EAF4EE;
            --border: #C4DCCB;
            --accent: #0B7A40;
            --accent-glow: rgba(11, 122, 64, 0.08);
            --accent-mid: rgba(11, 122, 64, 0.18);
            --warm: #6B4C1A;
            --text: #0C1E14;
            --text-dim: #3B6450;
            --text-dimmer: #7BA08A;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --r: 8px;
            --r-lg: 14px;
            --t: 0.2s ease;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
            --shadow-hover: 0 4px 16px rgba(11, 122, 64, 0.13);
            --nav-bg: rgba(243, 249, 245, 0.88);
            --shadow-soft: 0 2px 8px rgba(11, 122, 64, 0.25);
            --shadow-photo: 0 8px 24px rgba(11, 122, 64, 0.18);
        }

        [data-theme="dark"] {
            --bg: #0A140F;
            --surface: #101D15;
            --surface-2: #16261C;
            --border: #24392C;
            --accent: #34D399;
            --accent-glow: rgba(52, 211, 153, 0.10);
            --accent-mid: rgba(52, 211, 153, 0.22);
            --warm: #E0B341;
            --text: #EAF3EC;
            --text-dim: #9FC0AC;
            --text-dimmer: #5C7A68;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 4px 18px rgba(52, 211, 153, 0.18);
            --nav-bg: rgba(10, 20, 15, 0.85);
            --shadow-soft: 0 2px 10px rgba(52, 211, 153, 0.28);
            --shadow-photo: 0 8px 26px rgba(52, 211, 153, 0.22);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity var(--t);
        }

        a:hover {
            opacity: 0.72;
        }

        .container {
            max-width: 1060px;
            margin: 0 auto;
            padding: 0 24px;
        }

        section {
            padding: 80px 0;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 58px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--nav-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        nav.scrolled {
            border-bottom-color: var(--border);
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        }

        .nav-logo {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.06em;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.04em;
            color: var(--text-dim);
            transition: color var(--t);
        }

        .nav-links a:hover {
            color: var(--text);
            opacity: 1;
        }

        .nav-cta {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent) !important;
            border: 1px solid var(--accent);
            padding: 5px 14px;
            border-radius: var(--r);
            transition: background var(--t) !important;
        }

        .nav-cta:hover {
            background: var(--accent-glow);
            opacity: 1 !important;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
            transition: border-color var(--t), background var(--t), transform var(--t);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--surface-2);
            transform: rotate(14deg);
        }

        .nav-hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .nav-hamburger span {
            display: block;
            width: 22px;
            height: 1.5px;
            background: var(--text-dim);
            transition: var(--t);
        }

        /* ── HERO ── */
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 58px;
        }

        #hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='%230B7A40' stroke-width='0.7' opacity='0.08' fill='none'%3E%3Cline x1='0' y1='25' x2='40' y2='25'/%3E%3Cline x1='60' y1='25' x2='100' y2='25'/%3E%3Cline x1='0' y1='75' x2='100' y2='75'/%3E%3Cline x1='25' y1='0' x2='25' y2='100'/%3E%3Cline x1='75' y1='0' x2='75' y2='60'/%3E%3Cline x1='75' y1='80' x2='75' y2='100'/%3E%3Ccircle cx='25' cy='25' r='2.5' fill='%230B7A40' opacity='0.22'/%3E%3Ccircle cx='75' cy='75' r='2.5' fill='%230B7A40' opacity='0.22'/%3E%3Ccircle cx='25' cy='75' r='1.5' fill='%230B7A40' opacity='0.14'/%3E%3Ccircle cx='75' cy='25' r='1.5' fill='%230B7A40' opacity='0.10'/%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }

        #hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 72% 80% at 28% 50%, transparent 30%, var(--bg) 100%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            gap: 48px;
            flex-wrap: wrap;
            max-width: 1060px;
        }

        .hero-text {
            flex: 1 1 400px;
            max-width: 600px;
        }

        .hero-photo {
            flex-shrink: 0;
            margin-top: 10px;
        }

        .hero-photo img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: var(--shadow-photo);
            display: block;
            background: var(--surface-2);
        }

        .hero-eyebrow {
            font-family: var(--font-mono);
            font-size: 11.5px;
            letter-spacing: 0.18em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero-eyebrow::before {
            content: '';
            display: block;
            width: 26px;
            height: 1px;
            background: var(--accent);
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(38px, 6.5vw, 68px);
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: -0.025em;
            color: var(--text);
            margin-bottom: 14px;
        }

        .hero-role {
            font-family: var(--font-display);
            font-size: clamp(14px, 1.8vw, 17px);
            font-weight: 400;
            color: var(--text-dim);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .hero-role span {
            color: var(--accent);
            font-weight: 600;
        }

        .hero-bio {
            font-size: 14.5px;
            color: var(--text-dim);
            max-width: 540px;
            margin-bottom: 34px;
            line-height: 1.72;
        }

        .hero-stats {
            display: flex;
            margin-bottom: 38px;
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: hidden;
            width: fit-content;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .stat-item {
            padding: 12px 22px;
            border-right: 1px solid var(--border);
            text-align: center;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 19px;
            font-weight: 500;
            color: var(--accent);
            display: block;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dimmer);
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            padding: 11px 24px;
            border-radius: var(--r);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity var(--t);
            box-shadow: var(--shadow-soft);
        }

        .btn-primary:hover {
            opacity: 0.86;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 14px;
            padding: 11px 24px;
            border-radius: var(--r);
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: border-color var(--t), background var(--t);
            box-shadow: var(--shadow);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: var(--surface-2);
            color: var(--text);
            opacity: 1;
        }

        /* ── SECTION LABELS ── */
        .section-label {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 27px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 36px;
        }

        /* ── SKILLS ── */
        #skills {
            border-top: 1px solid var(--border);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .skill-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            transition: border-color var(--t), box-shadow var(--t), background var(--t);
        }

        .skill-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
            background: var(--surface-2);
        }

        .skill-card-title {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 11px;
            background: var(--surface-2);
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* ── PROJECTS ── */
        #projects {
            border-top: 1px solid var(--border);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 26px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: border-color var(--t), box-shadow var(--t), transform var(--t);
        }

        .project-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .project-card.featured {
            grid-column: 1 / -1;
            border-left: 3px solid var(--accent);
        }

        .project-type {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--warm);
            margin-bottom: 8px;
        }

        .project-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .project-card.featured .project-title {
            font-size: 20px;
        }

        .project-highlights {
            list-style: none;
            margin-bottom: 20px;
            flex: 1;
        }

        .project-highlights li {
            font-size: 13.5px;
            color: var(--text-dim);
            padding: 5px 0 5px 16px;
            position: relative;
            line-height: 1.55;
        }

        .project-highlights li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 10px;
            top: 7px;
        }

        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .project-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tool-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--accent-mid);
            padding: 3px 9px;
            border-radius: 4px;
        }

        .project-date {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dimmer);
            white-space: nowrap;
        }

        .report-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            border: 1px solid var(--accent);
            background: var(--accent-glow);
            padding: 5px 12px;
            border-radius: var(--r);
            transition: background var(--t), color var(--t);
            white-space: nowrap;
        }

        .report-btn:hover {
            background: var(--accent);
            color: #fff;
            opacity: 1;
        }

        .report-btn i {
            font-size: 11px;
        }

        /* ── EXPERIENCE ── */
        #experience {
            border-top: 1px solid var(--border);
        }

        .exp-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 30px 32px;
            box-shadow: var(--shadow);
        }

        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .exp-role {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .exp-company {
            font-family: var(--font-display);
            font-size: 13.5px;
            color: var(--accent);
            margin-top: 4px;
        }

        .exp-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .exp-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dimmer);
        }

        .exp-location {
            font-size: 12px;
            color: var(--text-dimmer);
        }

        .cert-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            border: 1px solid var(--accent);
            background: var(--accent-glow);
            padding: 5px 12px;
            border-radius: var(--r);
            transition: background var(--t), color var(--t);
            margin-top: 2px;
        }

        .cert-btn:hover {
            background: var(--accent);
            color: #fff;
            opacity: 1;
        }

        .exp-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0 0 20px;
        }

        .exp-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 28px;
        }

        .exp-list li {
            font-size: 13.5px;
            color: var(--text-dim);
            padding-left: 16px;
            position: relative;
            line-height: 1.5;
        }

        .exp-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 10px;
            top: 4px;
        }

        /* ── LEADERSHIP ── */
        #leadersh
